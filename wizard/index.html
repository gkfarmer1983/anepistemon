	function dogPose(step) {

		}));

			body,
			legs
		};
	}
	const DOG_POSES = [
		0,
		1,
		2,
		3
	].map(dogPose);
	const DOG_SIT = [];
	{
		const stand = dogPose(0);
		for (const [x, y] of stand.body) DOG_SIT.push([x, y + 2]);
		for (const [x, y] of stand.legs) if (x < 8) {
			if (y >= 12) DOG_SIT.push([Math.max(0, x - 1), 12]);

		0,

	];

		-1,
		0,
		1,

	];
	function runFinal(canvas, wrap, opts) {
		const ctx = canvas.getContext("2d");

		const ring = wrap.querySelector("#ring");
		const knob = wrap.querySelector("#knob");
		const btn = wrap.querySelector("#a");
		const K = {};

			oy: 0,
			x: 0,
			y: 0
		};
		let touchA = false;
		let tap = 0;
		let dead = false;
		let raf = 0;
		let ac = null;
		let t = 0;
		let pa = false;
		let mode = "play";
		let endT = 0;
		let shake = 0;
		let friendA = 0;
		let goatA = 0;
		let againA = 0;
		let black = 0;
		let spiritX = 0;
		let spiritY = 0;
		let satAt = -1;
		let seatX = 0;
		let seatY = 0;
		let sung = false;
		const p = {
			x: 72,
			y: 176,
			d: 0,
			hp: 6,
			inv: 0,
			atk: 0,
			kb: 0,
			kd: 0,
			vx: 0,
			vy: 0
		};
		let dog = {
			x: 72,
			y: 96,
			flip: false,
			hp: 10,
			hit: 0,
			kb: 0,
			kd: 0,
			wt: 0,
			wd: 0,
			mv: 0
		};
		let rats = [];
		let items = [];
		let sparks = [];
		function unlock() {
			if (ac) return;
			const Ctx = window.AudioContext || window.webkitAudioContext;
			if (!Ctx) return;
			ac = new Ctx();
			ac.resume();
		}
		function beep(freq, dur, type, gain) {
			if (!ac) return;
			const o = ac.createOscillator();
			const gn = ac.createGain();
			o.type = type;
			o.frequency.value = freq;
			gn.gain.setValueAtTime(gain, ac.currentTime);
			gn.gain.exponentialRampToValueAtTime(.001, ac.currentTime + dur);
			o.connect(gn);
			gn.connect(ac.destination);
			o.start();
			o.stop(ac.currentTime + dur);
		}
		function burst(x, y, n) {
			for (let i = 0; i < n; i++) {
				const a = Math.PI * 2 * i / n;
				sparks.push({
					x,
					y,
					dx: Math.cos(a) * 1.4,
					dy: Math.sin(a) * 1.4,
					l: 16
				});
			}
		}
		function spawn() {
			mode = "play";
			endT = 0;
			black = 0;
			friendA = 0;
			goatA = 0;
			againA = 0;
			sung = false;
			satAt = -1;
			shake = 0;
			p.x = 72;
			p.y = 176;
			p.d = 0;

		function spr(a, x, y, c, flip = false) {
			g.fillStyle = c;
			const X = Math.round(x);
			const Y = Math.round(y);
			const w = a[0].length;
			for (let j = 0; j < a.length; j++) for (let i = 0; i < w; i++) if (a[j][flip ? w - 1 - i : i] === "#") g.fillRect(X + i, Y + j, 1, 1);
		}
		function pix(pts, x, y, c, flip, alpha = 1) {
			g.globalAlpha = alpha;
			g.fillStyle = c;
			const X = Math.round(x);
			const Y = Math.round(y);
			for (const [px, py] of pts) g.fillRect(X + (flip ? 15 - px : px), Y + py, 1, 1);

		}
		function solid(x, y) {
			const c = Math.floor(x / T);

			if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return true;

		}
		function blocked(x, y, w, lim) {
			if (lim && (x < 0 || y < OY || x + w > W || y + w > 240)) return true;
			for (const [cx, cy] of [
				[x, y],
				[x + w - 1, y],

			]) if (solid(cx, cy)) return true;

		function move(o, dx, dy, ins) {

		function hurt(fx, fy) {

			const ay = Math.abs(dy);

			const v = dy > 0 ? 2 : 0;
			const a = ax >= ay ? h : v;
			const b = ax >= ay ? v : h;
			let mv = move(dog, DX[a] * sp, DY[a] * sp, 2);
			if (!mv) mv = move(dog, DX[b] * sp, DY[b] * sp, 2);
			dog.mv = mv;
			dog.flip = dx < 0;

		function update() {

				tap = 0;
				return;
			}
			if (mode === "outro") {
				endT++;
				stepHome();

				if (local < 36) {
					spiritX = dog.x;
					spiritY = dog.y;

				black = local < 150 ? 0 : Math.min(1, (local - 150) / 80);
				friendA = Math.max(0, Math.min(1, (local - 250) / 55));
				goatA = Math.max(0, Math.min(1, (local - 345) / 55));
				againA = Math.max(0, Math.min(1, (local - 470) / 50));

			}

				const v = dirIn();

					p.d = v;
					const dx = DX[v] * SP;
					const dy = DY[v] * SP;
					move(p, dx, dy, 3);
					p.vx = dx;
					p.vy = dy;
				}
			}
			pa = a;
			if (shake > 0) shake *= .8;

				const [a1, b1, c1, d1] = sword();

					dog.hp--;
					dog.hit = 16;
					dog.kb = 5;
					dog.kd = p.d;
					shake = Math.max(shake, 2.5);
					beep(180 + dog.hp * 18, .08, "square", .05);
					if (dog.hp <= 0) startOutro();
				}
				for (let i = rats.length - 1; i >= 0; i--) {
					const e = rats[i];
					if (e.hit > 0) continue;
					if (ov(a1, b1, c1, d1, e.x + 2, e.y + 2, 12, 12)) {
						rats.splice(i, 1);
						burst(e.x + 8, e.y + 8, 7);
						beep(680, .07, "square", .04);
						if (Math.random() < .5) items.push({
							x: e.x + 4,
							y: e.y + 4,
							l: 700
						});
					}
				}
			}
			if (mode === "play") {
				if (dog.hit > 0) dog.hit--;
				if (dog.kb > 0) {
					dog.kb--;
					move(dog, DX[dog.kd] * 1.6, DY[dog.kd] * 1.6, 2);
				} else chase(dog, .62);
				if (p.x < dog.x - 1) dog.flip = true;
				else if (p.x > dog.x + 1) dog.flip = false;
				if (ov(p.x + 3, p.y + 3, 10, 10, dog.x + 2, dog.y + 2, 12, 12)) hurt(dog.x, dog.y);
			}
			for (const e of rats) {
				if (e.hit > 0) e.hit--;
				if (e.kb > 0) {
					e.kb--;
					move(e, DX[e.kd] * 2, DY[e.kd] * 2, 2);
					continue;
				}
				if (--e.t <= 0) {
					if (Math.random() < .45) {
						const dx = p.x - e.x;
						const dy = p.y - e.y;
						e.d = Math.abs(dx) > Math.abs(dy) ? dx > 0 ? 1 : 3 : dy > 0 ? 2 : 0;

					e.t = 28 + (Math.random() * 40 | 0);

				const sp = .8;
				e.mv = move(e, DX[e.d] * sp, DY[e.d] * sp, 2);
				if (!e.mv) e.t = 0;
				if (e.d === 1) e.flip = true;
				else if (e.d === 3) e.flip = false;

			for (let i = items.length - 1; i >= 0; i--) {

		function txtFit(s, y, c, alpha, scale = 1) {
			if (alpha <= 0) return;
			g.save();
			g.globalAlpha = alpha;
			g.font = "8px \"Press Start 2P\", monospace";
			const w = g.measureText(s).width;
			const sc = Math.min(scale, w > 150 ? 150 / w : scale);
			g.translate(80, y);
			g.scale(sc, sc);
			g.textAlign = "center";
			g.textBaseline = "top";
			g.fillStyle = c;
			g.fillText(s, 0, 0);
			g.restore();
		}
		function draw() {
			const sx = shake > .2 ? ((t & 1) * 2 - 1) * Math.min(2, shake) : 0;
			const sy = shake > .2 ? ((t & 2) - 1) * Math.min(1, shake * .5) : 0;
			g.fillStyle = "#000";
			g.fillRect(0, 0, W, H);
			g.save();
			g.beginPath();
			g.rect(0, OY, W, PH);
			g.clip();
			g.translate(sx, sy);
			for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
				const x = c * T;
				const y = OY + r * T;
				if (ROOM[r][c] === "W") spr(WALL, x, y, M);
				else if ((c * 7 + r * 13) % 11 === 0) {
					g.fillStyle = D;
					g.fillRect(x + 7, y + 7, 2, 2);
				}
			}
			for (const it of items) if (it.l > 120 || t >> 3 & 1) spr(HEART, it.x, it.y, G);
			for (const e of rats) {
				const alpha = e.fade > 0 ? Math.max(0, 1 - e.fade) : 1;
				if (alpha <= 0) continue;
				if (e.hit > 0 && !(t >> 2 & 1)) continue;
				const step = e.mv ? (Math.floor(t / 5) + e.d) % 4 : 3;
				const tip = Math.floor(t / 8) % 4;
				pix(RAT_POSES[step * 4 + tip], e.x, e.y, G, e.flip, alpha);
			}
			if (mode !== "outro" || black < 1) {
				const pose = dog.mv && (mode === "play" || satAt < 0) ? DOG_POSES[Math.floor(t / (mode === "outro" ? 8 : 10)) % 4] : DOG_POSES[0];
				if (!(dog.hit > 0 && mode === "play" && !(t >> 1 & 1)) && (dog.hp > 0 || mode === "outro" && satAt < 0)) pix(pose.body.concat(pose.legs), dog.x, dog.y, G, dog.flip);
				if (mode === "outro" && satAt >= 0) pix(DOG_SIT, dog.x, dog.y, G, dog.flip);
				if (mode === "outro") {
					const local = satAt < 0 ? -1 : endT - satAt;
					const rise = Math.max(0, local - 40) * .55;
					const sa = local < 36 ? 0 : local < 70 ? (local - 36) / 34 : Math.max(0, 1 - (local - 80) / 120);
					if (sa > 0) {
						pix(firePose(Math.floor(local / 6) % 6, Math.floor(local / 36) % 2), spiritX, spiritY - rise, G, false, sa);
						g.globalAlpha = sa * .7;
						g.fillStyle = G;
						for (let i = 0; i < 4; i++) {
							const yy = spiritY + 8 - rise - i * 6 - local % 8;
							g.fillRect(Math.round(spiritX + 6 + (i & 1 ? 3 : -1)), Math.round(yy), 1, 1);
						}
						g.globalAlpha = 1;
					}
				}
			}
			g.fillStyle = G;
			for (const s of sparks) if (s.l >> 1 & 1 || s.l > 6) g.fillRect(Math.round(s.x), Math.round(s.y), 1, 1);
			if (p.inv <= 0 || t >> 2 & 1) spr(WIZ, p.x, p.y, G, p.d === 3);
			if (mode === "play" && p.atk > 2 && p.atk < 13) spr(SW[p.d], p.x + SWP[p.d][0], p.y + SWP[p.d][1], G);
			g.restore();
			g.fillStyle = "#000";
			g.fillRect(0, 0, W, OY);
			g.fillStyle = D;
			g.fillRect(0, 15, W, 1);
			for (let i = 0; i < 3; i++) spr(HEART, 4 + i * 10, 4, p.hp >= 2 * i + 2 ? G : p.hp === 2 * i + 1 ? M : D);
			for (let i = 0; i < 10; i++) {
				g.fillStyle = i < dog.hp ? G : D;
				g.fillRect(78 + i % 10 * 7, 5, 5, 5);
			}
			if (black > 0) {
				g.fillStyle = `rgba(0,0,0,${black})`;
				g.fillRect(0, 0, W, H);
			}
			if (mode === "outro" && black > .92) {
				txtFit("best friend.. saved", 78, G, friendA);
				txtFit("you are the goat", 104, G, goatA);
				txtFit("play again?", 156, M, againA, .62);
			}
			if (mode === "dead") {
				g.fillStyle = "rgba(0,0,0,.75)";
				g.fillRect(0, OY, W, PH);
				txtFit("GAME OVER", 100, G, 1);
				txtFit("TAP A", 124, M, t >> 4 & 1 ? 1 : .35);
			}
		}
		let last = 0;
		let acc = 0;
		function loop(ts) {
			if (dead) return;
			acc += Math.min(ts - last, 100);
			last = ts;
			while (acc >= 16.67) {
				update();
				acc -= 16.67;
				if (dead) return;
			}
			draw();
			raf = requestAnimationFrame(loop);
		}
		function keyName(e) {
			return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase();
		}
		const down = (e) => {
			unlock();
			const k = keyName(e);
			K[k] = 1;
			if (k.startsWith("arrow") || k === " ") e.preventDefault();
		};
		const up = (e) => {
			K[keyName(e)] = 0;
		};
		const blur = () => {
			for (const k of Object.keys(K)) K[k] = 0;
			touchA = false;
			joy.on = false;
			joy.x = joy.y = 0;
		};
		const poke = () => {
			tap = 1;
			unlock();
		};
		const joyDown = (e) => {
			if (e.target === btn || joy.on) return;
			const r = wrap.getBoundingClientRect();
			if (e.clientX - r.left > r.width * .6) return;
			joy.on = true;
			joy.id = e.pointerId;
			joy.ox = e.clientX;
			joy.oy = e.clientY;
			ring.style.left = e.clientX - r.left + "px";
			ring.style.top = e.clientY - r.top + "px";
			ring.style.opacity = "0.7";
			try {
				wrap.setPointerCapture(e.pointerId);
			} catch {}
		};
		const joyMove = (e) => {
			if (!joy.on || e.pointerId !== joy.id) return;
			let dx = (e.clientX - joy.ox) / 32;
			let dy = (e.clientY - joy.oy) / 32;
			const m = Math.hypot(dx, dy);
			if (m > 1) {
				dx /= m;
				dy /= m;
			}
			joy.x = dx;
			joy.y = dy;
			knob.style.transform = `translate(${dx * 22}px,${dy * 22}px)`;
		};
		const joyEnd = (e) => {
			if (e.pointerId !== joy.id) return;
			joy.on = false;
			joy.x = joy.y = 0;
			ring.style.opacity = "0";
			knob.style.transform = "";
		};
		const aDown = (e) => {
			e.stopPropagation();
			e.preventDefault();
			touchA = true;
			unlock();
			try {
				btn.setPointerCapture(e.pointerId);
			} catch {}
		};
		const aUp = () => {
			touchA = false;
		};
		addEventListener("keydown", down);
		addEventListener("keyup", up);
		addEventListener("blur", blur);
		wrap.addEventListener("pointerdown", poke);
		wrap.addEventListener("pointerdown", joyDown);
		wrap.addEventListener("pointermove", joyMove);
		wrap.addEventListener("pointerup", joyEnd);
		wrap.addEventListener("pointercancel", joyEnd);
		btn.addEventListener("pointerdown", aDown);
		btn.addEventListener("pointerup", aUp);
		btn.addEventListener("pointercancel", aUp);
		const CODE = {
			KeyA: "a",
			KeyD: "d",
			KeyW: "w",
			KeyS: "s",
			ArrowLeft: "arrowleft",
			ArrowRight: "arrowright",
			ArrowUp: "arrowup",
			ArrowDown: "arrowdown",
			Space: " ",
			KeyZ: "z"
		};
		window.__controlsTest = {
			getX: () => p.x,
			getY: () => p.y,
			getYaw: () => 0,
			getSpeed: () => Math.hypot(p.vx, p.vy),
			setKeys: (codes) => {
				for (const k of Object.keys(K)) K[k] = 0;
				for (const c of codes) K[CODE[c] || c.toLowerCase()] = 1;
			},
			forceEnding: () => {
				if (mode !== "play") return;
				dog.hp = 0;
				startOutro();
			}
		};
		spawn();
		raf = requestAnimationFrame(loop);
		return () => {
			dead = true;
			cancelAnimationFrame(raf);
			removeEventListener("keydown", down);
			removeEventListener("keyup", up);
			removeEventListener("blur", blur);
			wrap.removeEventListener("pointerdown", poke);
			wrap.removeEventListener("pointerdown", joyDown);
			wrap.removeEventListener("pointermove", joyMove);
			wrap.removeEventListener("pointerup", joyEnd);
			wrap.removeEventListener("pointercancel", joyEnd);
			btn.removeEventListener("pointerdown", aDown);
			btn.removeEventListener("pointerup", aUp);
			btn.removeEventListener("pointercancel", aUp);
			if (window.__controlsTest) delete window.__controlsTest;
		};
	}

			const sc0 = Math.max(0, Math.min(9, Math.round(e.x / T))), sr0 = Math.max(0, Math.min(13, Math.round((e.y - OY) / T)));
			const gc = Math.max(0, Math.min(9, Math.floor((p.x + 8) / T))), gr = Math.max(0, Math.min(13, Math.floor((p.y + 8 - OY) / T)));
			const free = (c, r) => {
				const v = cm[r][c];
				return !(v == 1 || v == 2 || v == 5 && doorAt[sx + "," + sy + "," + c + "," + r].st != 2);
			};
			const prev = {}, q = [[sc0, sr0]];
			prev[sc0 + "," + sr0] = null;
			while (q.length) {
				const [c, r] = q.shift();
				if (c == gc && r == gr) break;
				for (let d = 0; d < 4; d++) {
					const nc = c + DX[d], nr = r + DY[d];
					if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS || nc + "," + nr in prev || !free(nc, nr)) continue;
					prev[nc + "," + nr] = [c, r];
					q.push([nc, nr]);
				}
			}
			let cur = gc + "," + gr;
			if (!(cur in prev)) return null;
			while (prev[cur] && prev[prev[cur].join()]) cur = prev[cur].join();
			const [c, r] = cur.split(",").map(Number);
			return [c * T, OY + r * T];
		}
		function startTrans(dx, dy) {
			const old = sx + "," + sy;
			sx += dx;
			sy += dy;
			cm = MAP[sx + "," + sy];
			trans = {
				dx,
				dy,
				p: 0,
				old: MAP[old],
				oldKey: old
			};
			if (dx < 0) p.x = 147;
			if (dx > 0) p.x = -3;
			if (dy < 0) p.y = 227;
			if (dy > 0) p.y = 13;
			const nk = sx + "," + sy;
			p.lock = DOORS.find((d) => d.scr.includes(old) && d.scr.includes(nk)) || null;
			enter();
		}
		const K = IN.K, joy = IN.joy;
		function dirIn() {
			let x = joy.x, y = joy.y;
			if (Math.hypot(x, y) < .35) {
				x = (K.arrowright || K.d ? 1 : 0) - (K.arrowleft || K.a ? 1 : 0);
				y = (K.arrowdown || K.s ? 1 : 0) - (K.arrowup || K.w ? 1 : 0);
			}
			if (!x && !y) return null;
			return Math.abs(x) > Math.abs(y) ? x > 0 ? 1 : 3 : y > 0 ? 2 : 0;
		}
		const atkIn = () => IN.touchA || K[" "] || K.z || K.x || K.enter;
		function update() {
			t++;
			const a = atkIn();
			if (over) {
				if (a && !pa) reset();
				pa = a;
				return;
			}
			if (win) {
				if (a && !pa) {
					IN.next();
					return;
				}
				pa = a;
				return;
			}
			if (trans) {
				trans.p += 1 / 22;
				if (trans.p >= 1) trans = null;
				pa = a;
				return;
			}
			if (p.inv > 0) p.inv--;
			if (p.kb > 0) {
				p.kb--;
				move(p, DX[p.kd] * 2, DY[p.kd] * 2, 3);
			} else if (p.atk > 0) p.atk--;
			else if (a && !pa) p.atk = 14;
			else {
				const v = dirIn();
				if (v != null) {
					p.d = v;
					move(p, DX[v] * SP, DY[v] * SP, 3);
				}
			}
			pa = a;
			let dx = 0, dy = 0;
			if (p.x < -4) dx = -1;
			else if (p.x > 148) dx = 1;
			else if (p.y < 12) dy = -1;
			else if (p.y > 228) dy = 1;
			if (dx || dy) {
				startTrans(dx, dy);
				return;
			}
			if (p.lock) {
				const [c, r] = p.lock.t[sx + "," + sy];
				if (!ov(p.x + 3, p.y + 3, 10, 10, c * T, OY + r * T, T, T)) {
					p.lock.st = 3;
					p.lock = null;
				}
			}
			if (!sc.cleared && ens.length == 0 && !items.some((i) => i.k == 2)) {
				sc.cleared = 1;
				sc.doors.forEach((d) => {
					if (d.st == 0) {
						d.st = 1;
						d.bt = 72;
					}
				});
			}
			DOORS.forEach((d) => {
				if (d.st == 1 && --d.bt <= 0) d.st = 2;
			});
			if (p.atk > 2 && p.atk < 13) {
				const [a1, b1, c1, d1] = sword();
				for (let i = ens.length - 1; i >= 0; i--) {
					const e = ens[i];
					if (ov(a1, b1, c1, d1, e.x + 2, e.y + 2, 12, 12) && !(e.hit > 0)) {
						if (--e.hp > 0) {
							e.hit = 30;
							e.kb = 6;
							e.kd = p.d;
						} else {
							ens.splice(i, 1);
							if (e.gs) items.push({
								x: e.x + 4,
								y: e.y + 4,
								k: 2,
								l: Infinity
							});
							else if (Math.random() < .3) items.push({
								x: e.x + 4,
								y: e.y + 4,
								k: 0,
								l: 600
							});
						}
					}
				}
			}
			for (const e of ens) {
				if (e.hit > 0) e.hit--;
				if (e.kb > 0) {
					e.kb--;
					move(e, DX[e.kd] * 2, DY[e.kd] * 2, 2, 1);
					continue;
				}
				if (e.tp == "skel") {
					if (--e.pt <= 0) {
						const s = nextStep(e);
						e.pt = 12;
						if (s) {
							e.tx = s[0];
							e.ty = s[1];
						} else {
							e.tx = e.x;
							e.ty = e.y;
						}
					}
					const ddx = e.tx - e.x, ddy = e.ty - e.y, sp = .7, sx2 = Math.sign(ddx) * Math.min(sp, Math.abs(ddx)), sy2 = Math.sign(ddy) * Math.min(sp, Math.abs(ddy));
					if (Math.abs(ddx) >= Math.abs(ddy)) {
						move(e, sx2, 0, 2, 1);
						if (Math.abs(ddy) > 0) move(e, 0, sy2 * .6, 2, 1);
					} else {
						move(e, 0, sy2, 2, 1);
						if (Math.abs(ddx) > 0) move(e, sx2 * .6, 0, 2, 1);
					}
					if (--e.cd <= 0 && Math.random() < .02) {
						const ex = p.x - e.x, ey = p.y - e.y;
						shots.push({
							x: e.x + 5,
							y: e.y + 5,
							d: Math.abs(ex) > Math.abs(ey) ? ex > 0 ? 1 : 3 : ey > 0 ? 2 : 0
						});
						e.cd = 100;
					}
				} else {
					if (--e.t <= 0) {
						e.d = Math.random() * 4 | 0;
						e.t = 40 + Math.random() * 60;
					}
					if (!move(e, DX[e.d] * .5, DY[e.d] * .5, 2, 1)) e.t = 0;
				}
				if (ov(p.x + 3, p.y + 3, 10, 10, e.x + 2, e.y + 2, 12, 12)) hurt(e.x, e.y);
			}
			for (let i = shots.length - 1; i >= 0; i--) {
				const s = shots[i];
				s.x += DX[s.d] * 1.6;
				s.y += DY[s.d] * 1.6;
				if (s.x < 0 || s.x > 154 || s.y < OY || s.y > 234 || sol(s.x + 3, s.y + 3)) {
					shots.splice(i, 1);
					continue;
				}
				if (ov(p.x + 3, p.y + 3, 10, 10, s.x, s.y, 6, 6)) {
					hurt(s.x, s.y);
					shots.splice(i, 1);
				}
			}
			for (let i = items.length - 1; i >= 0; i--) {
				const it = items[i];
				if (--it.l <= 0) {
					items.splice(i, 1);
					continue;
				}
				if (ov(p.x + 3, p.y + 3, 10, 10, it.x, it.y, 8, 8)) {
					if (it.k == 2) stones++;
					else p.hp = Math.min(6, p.hp + 2);
					items.splice(i, 1);
				}
			}
			const tc = Math.floor((p.x + 8) / T), tr = Math.floor((p.y + 8 - OY) / T);
			if (msgT > 0) msgT--;
			if (cm[tr] && cm[tr][tc] == 3) {
				if (stones >= 8) win = 1;
				else if (msgT == 0) {
					msg = "NEED 8 GEMSTONES";
					msgT = 90;
				}
			}
		}
		function drawMap(m, key, ox, oy) {
			for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
				const v = m[r][c], x = c * T + ox, y = OY + r * T + oy;
				if (v == 1) spr(WALL, x, y, M);
				else if (v == 2) spr(ROOM, x, y, M);
				else if (v == 3) spr(SHRINE, x, y, G);
				else if (v == 5) {
					const d = doorAt[key + "," + c + "," + r];
					if (d.st == 0 || d.st == 3 || d.st == 1 && Math.floor(d.bt / 9) % 2 == 0) spr(DOOR, x, y, G);
				} else if ((c * 7 + r * 13) % 11 == 0) {
					g.fillStyle = D;
					g.fillRect(Math.round(x) + 7, Math.round(y) + 7, 2, 2);
				}
			}
		}
		function txt(s, x, y, c, al) {
			g.font = "8px \"Press Start 2P\",monospace";
			g.textBaseline = "top";
			g.textAlign = al || "left";
			g.fillStyle = c;
			g.fillText(s, x, y);
		}
		function draw() {
			g.fillStyle = "#000";
			g.fillRect(0, 0, W, H);
			g.save();
			g.beginPath();
			g.rect(0, OY, W, PH);
			g.clip();
			let ox = 0, oy = 0;
			if (trans) {
				const q = 1 - trans.p;
				ox = trans.dx * W * q;
				oy = trans.dy * PH * q;
				drawMap(trans.old, trans.oldKey, -trans.dx * W * trans.p, -trans.dy * PH * trans.p);
			}
			drawMap(cm, sx + "," + sy, ox, oy);
			if (!trans) {
				for (const it of items) if (it.k == 2) spr(GEM, it.x, it.y + (t >> 5 & 1), G);
				else if (it.l > 120 || t >> 3 & 1) spr(HEART, it.x, it.y, G);
				g.fillStyle = G;
				for (const s of shots) g.fillRect(Math.round(s.x), Math.round(s.y), 6, 6);
				for (const e of ens) {
					if (e.hit > 0 && !(t >> 2 & 1)) continue;
					g.fillStyle = G;
					(e.tp == "skel" ? skPose(Math.floor(t / 7) % 6) : dmPose(t * 16.667)).forEach(([x, y]) => g.fillRect(Math.round(e.x) + x, Math.round(e.y) + y, 1, 1));
				}
			}
			if (p.inv <= 0 || t >> 2 & 1) spr(WIZ, p.x + ox, p.y + oy, G, p.d == 3);
			if (!trans && p.atk > 2 && p.atk < 13) spr(SW[p.d], p.x + SWP[p.d][0], p.y + SWP[p.d][1], G);
			if (msgT > 0) {
				const w = msg.length * 8 + 16, y = 116;
				g.fillStyle = "#000";
				g.fillRect(80 - w / 2, y, w, 24);
				g.strokeStyle = G;
				g.lineWidth = 1;
				g.strokeRect(80 - w / 2 + .5, 116.5, w - 1, 23);
				txt(msg, 80, 124, G, "center");
			}
			g.restore();
			g.fillStyle = "#000";
			g.fillRect(0, 0, W, OY);
			g.fillStyle = D;
			g.fillRect(0, 15, W, 1);
			for (let i = 0; i < 3; i++) spr(HEART, 4 + i * 10, 4, p.hp >= 2 * i + 2 ? G : p.hp == 2 * i + 1 ? M : D);
			spr(GEM, 46, 4, G);
			txt(stones + "/8", 56, 4, stones >= 8 ? G : M);
			txt("L4", 116, 4, G);
			for (let j = 0; j < 3; j++) for (let i = 0; i < 3; i++) {
				g.fillStyle = i == sx && j == sy ? G : D;
				g.fillRect(136 + i * 6, 2 + j * 4, 5, 3);
			}
			if (over || win) {
				g.fillStyle = "rgba(0,0,0,.75)";
				g.fillRect(0, OY, W, PH);
				txt(win ? "LEVEL CLEAR" : "GAME OVER", 80, 100, G, "center");
				txt("TAP A", 80, 124, M, "center");
			}
		}
		reset();
		return {
			update,
			draw
		};
	}
	//#endregion
	//#region src/game/campaign.ts
	const boots = [
		bootL1,
		bootL2,
		bootL3,
		bootL4
	];
	function startCampaign(cv, wrap) {
		const ctx = cv.getContext("2d");
		if (!ctx) throw new Error("no canvas");
		const g = ctx;
		const ring = wrap.querySelector("#ring");
		const knob = wrap.querySelector("#knob");
		const btn = wrap.querySelector("#a");
		const K = {};
		const joy = {
			on: false,
			id: -1,
			ox: 0,
			oy: 0,
			x: 0,
			y: 0
		};
		let touchA = false;
		let tap = 0;
		let dead = false;
		let raf = 0;
		let last = 0;
		let acc = 0;
		let stage = 0;
		let cur = null;
		let finalStop = null;
		let runningFinal = false;
		const input = {
			cv,
			g,
			wrap,
			K,
			joy,
			get touchA() {
				return touchA;
			},
			set touchA(v) {
				touchA = v;
			},
			get tap() {
				return tap;
			},
			set tap(v) {
				tap = v;
			},
			next() {
				go(stage + 1);
			}
		};
		function go(i) {
			stage = i;
			tap = 0;
			touchA = false;
			joy.x = 0;
			joy.y = 0;
			for (const k of Object.keys(K)) K[k] = 0;
			if (i >= boots.length) {
				runningFinal = true;
				cur = null;
				finalStop = runFinal(cv, wrap, { onReplay() {
					const stop = finalStop;
					finalStop = null;
					runningFinal = false;
					stop?.();
					go(0);
					last = 0;
					acc = 0;
					cancelAnimationFrame(raf);
					raf = requestAnimationFrame(loop);
				} });
				return;
			}
			runningFinal = false;
			cur = boots[i](input);
		}
		function loop(ts) {
			if (dead || runningFinal) return;
			acc += Math.min(ts - (last || ts), 100);
			last = ts;
			while (acc >= 16.67) {
				cur?.update();
				acc -= 16.67;
				if (runningFinal || dead) return;
			}
			cur?.draw();
			raf = requestAnimationFrame(loop);
		}
		function keyName(e) {
			return e.key.toLowerCase();
		}
		const down = (e) => {
			if (runningFinal) return;
			const k = keyName(e);
			K[k] = 1;
			if (k.startsWith("arrow") || k === " ") e.preventDefault();
		};
		const up = (e) => {
			if (runningFinal) return;
			K[keyName(e)] = 0;
		};
		const blur = () => {
			for (const k of Object.keys(K)) K[k] = 0;
			touchA = false;
			joy.on = false;
			joy.x = joy.y = 0;
			ring.style.opacity = "0";
			knob.style.transform = "";
		};
		const poke = () => {
			if (!runningFinal) tap = 1;
		};
		const joyDown = (e) => {
			if (runningFinal || e.target === btn || joy.on) return;
			const r = wrap.getBoundingClientRect();
			if (e.clientX - r.left > r.width * .6) return;
			joy.on = true;
			joy.id = e.pointerId;
			joy.ox = e.clientX;
			joy.oy = e.clientY;
			ring.style.left = e.clientX - r.left + "px";
			ring.style.top = e.clientY - r.top + "px";
			ring.style.opacity = "0.7";
			try {
				wrap.setPointerCapture(e.pointerId);
			} catch {}
		};
		const joyMove = (e) => {
			if (runningFinal || !joy.on || e.pointerId !== joy.id) return;
			let dx = (e.clientX - joy.ox) / 32;
			let dy = (e.clientY - joy.oy) / 32;
			const m = Math.hypot(dx, dy);
			if (m > 1) {
				dx /= m;
				dy /= m;
			}
			joy.x = dx;
			joy.y = dy;
			knob.style.transform = `translate(${dx * 22}px,${dy * 22}px)`;
		};
		const joyEnd = (e) => {
			if (e.pointerId !== joy.id) return;
			joy.on = false;
			joy.x = joy.y = 0;
			ring.style.opacity = "0";
			knob.style.transform = "";
		};
		const aDown = (e) => {
			if (runningFinal) return;
			e.stopPropagation();
			e.preventDefault();
			touchA = true;
			try {
				btn.setPointerCapture(e.pointerId);
			} catch {}
		};
		const aUp = () => {
			touchA = false;
		};
		addEventListener("keydown", down);
		addEventListener("keyup", up);
		addEventListener("blur", blur);
		wrap.addEventListener("pointerdown", poke);
		wrap.addEventListener("pointerdown", joyDown);
		wrap.addEventListener("pointermove", joyMove);
		wrap.addEventListener("pointerup", joyEnd);
		wrap.addEventListener("pointercancel", joyEnd);
		btn.addEventListener("pointerdown", aDown);
		btn.addEventListener("pointerup", aUp);
		btn.addEventListener("pointercancel", aUp);
		go(0);
		raf = requestAnimationFrame(loop);
		return () => {
			dead = true;
			cancelAnimationFrame(raf);
			finalStop?.();
			finalStop = null;
			removeEventListener("keydown", down);
			removeEventListener("keyup", up);
			removeEventListener("blur", blur);
			wrap.removeEventListener("pointerdown", poke);
			wrap.removeEventListener("pointerdown", joyDown);
			wrap.removeEventListener("pointermove", joyMove);
			wrap.removeEventListener("pointerup", joyEnd);
			wrap.removeEventListener("pointercancel", joyEnd);
			btn.removeEventListener("pointerdown", aDown);
			btn.removeEventListener("pointerup", aUp);
			btn.removeEventListener("pointercancel", aUp);
		};
	}
	//#endregion
	//#region src/game/standalone.ts
	const cv = document.getElementById("c");
	const wrap = document.getElementById("wrap");
	if (cv instanceof HTMLCanvasElement && wrap instanceof HTMLElement) startCampaign(cv, wrap);
	//#endregion
})();
