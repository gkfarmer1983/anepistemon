<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fairy</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:grid;place-items:center}
#wrap{position:relative;height:min(calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),150vw);aspect-ratio:2/3;background:#000;cursor:pointer}
canvas{width:100%;height:100%;image-rendering:pixelated;display:block;filter:drop-shadow(0 0 3px rgba(57,255,20,.45))}
#wrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
</style></head><body>
<div id="wrap"><canvas id="c" width="160" height="240"></canvas></div>
<script>
(function () {
	const W = 160, H = 240, T = 16;
	const G = "#39ff14", M = "#0e9c24", D = "#07591a";
	const cv = document.getElementById("c"), wrap = document.getElementById("wrap"), g = cv.getContext("2d");
	try { document.fonts && document.fonts.load('8px "Press Start 2P"'); } catch (e) {}

	// fairy sprite (from your drawing): B = outline, C = fill
	// fairy sprite (from your drawing): B = outline, C = fill
	const FR = ["AAAAAAAAAAAAAAAA","AAAAAAAAAAAAAAAA","AAAAAABBBAAAAAAA","AAAAABCCCBAAAAAA","BBBCBBACABBCBBBA","BAACBBCCCBBCAABA","BBACCCCCCCCCABBA","ABAAAACCCAAAABAA","AABBBBCCCBBBBAAA","AAAABBCCCBBAAAAA","AAABBCBBBCBBAAAA","AAABBCBABCBBAAAA","AAAABBAAABBAAAAA","AAAAAAAAAAAAAAAA","AAAAAAAAAAAAAAAA","AAAAAAAAAAAAAAAA"];
	function fairy(x, y) {
		for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) {
			const c = FR[j][i]; if (c === "A") continue;
			g.fillStyle = c === "B" ? M : G; g.fillRect(Math.round(x) + i, Math.round(y) + j, 1, 1);
		}
	}
	const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
	function txt(s, x, y, c, al, sc) {
		g.save(); g.font = '8px "Press Start 2P",monospace'; g.textBaseline = "top"; g.textAlign = al || "left"; g.fillStyle = c;
		if (sc) { g.scale(sc, sc); g.fillText(s, x / sc, y / sc); } else g.fillText(s, x, y); g.restore();
	}
	// blob = outlined shape from row spans; first/last row stay outline-only
	function blob(x, y, rows, oc, fc) {
		rows.forEach(([sx, w], i) => R(x + sx, y + i, w, 1, oc));
		rows.forEach(([sx, w], i) => { if (i > 0 && i < rows.length - 1) R(x + sx + 1, y + i, w - 2, 1, fc); });
	}
	const PAD = [[3, 10], [1, 14], [0, 16], [0, 16], [1, 14], [3, 10]];
	const FROG = [[4, 8], [3, 10], [2, 12], [2, 12], [3, 10], [4, 8]];
	const FISH = [[3, 9], [2, 11], [1, 12], [1, 12], [2, 11], [3, 9]];

	function drawFrog(x, y) {
		blob(x, y + 9, PAD, M, D); R(x + 12, y + 11, 4, 1, "#000");
		blob(x, y + 6, FROG, M, G);
		R(x + 3, y + 4, 3, 3, M); R(x + 10, y + 4, 3, 3, M);
		R(x + 4, y + 5, 1, 1, G); R(x + 11, y + 5, 1, 1, G);
		R(x + 5, y + 10, 6, 1, D);
	}
	function drawFish(x, y, flip) {
		const f = (x0, w) => flip ? x + 16 - x0 - w : x + x0;
		blob(flip ? x + 2 : x, y, FISH, M, G);
		R(f(13, 1), y + 1, 1, 4, M); R(f(14, 1), y, 1, 6, M);
		R(f(3, 2), y + 2, 2, 2, flip ? D : D);
		R(f(3, 1), y + 2, 1, 1, "#000");
	}

	// ---------- game state ----------
	const LANES = [2, 4, 6, 8, 10, 12];
	let state, t, lives, pts, screenNo, finishing, et, speedMul, fairyP, hop, dead, frogs, fish, fishT, sparks, flashT, fade;

	function newFrogs() {
		frogs = [];
		const speeds = [.25, .4, .55, .75, .95, 1.15].sort(() => Math.random() - .5);
		LANES.forEach((row, li) => {
			const dir = li % 2 ? -1 : 1, sp = speeds[li] * speedMul;
			for (let i = 0; i < 2; i++) frogs.push({ x: (i * 96 + li * 31) % 192, y: row * T, dir, sp, tg: 0, tt: -1, ax: 0, ay: 0, cd: 0 });
		});
	}
	function spawnFairy() { fairyP = { x: 72, y: 14 * T }; hop = null; dead = 0; }
	function startGame() {
		state = "play"; lives = 3; pts = 0; screenNo = 1; finishing = false; speedMul = 1; fish = null; fishT = 200; sparks = []; flashT = 0; fade = 1;
		newFrogs(); spawnFairy();
	}
	function startEnd() { state = "end"; et = 0; fade = 0; sparks = []; }
	function burst(x, y, n) { for (let i = 0; i < n; i++) { const a = Math.PI * 2 * i / n; sparks.push({ x, y, dx: Math.cos(a) * 1.2, dy: Math.sin(a) * 1.2, l: 20 }); } }
	function kill(x, y) { if (dead) return; dead = 1; hop = null; burst(x, y, 10); lives--; }

	function tryHop(dx, dy) {
		if (state !== "play" || dead || hop || flashT) return;
		const nx = fairyP.x + dx * T, ny = fairyP.y + dy * T;
		if (nx < 0 || nx > W - T || ny < 0 || ny > H - T) return;
		hop = { fx: fairyP.x, fy: fairyP.y, tx: nx, ty: ny, k: 0 };
		pts++; // 1 hop = 1 point
	}

	function update() {
		t++;
		if (fade > 0) fade = Math.max(0, fade - 1 / 30);
		if (state === "end") { et++; return; }
		if (state !== "play") return;
		const cx = fairyP.x + 8, cy = fairyP.y + 8;

		if (hop) {
			hop.k++;
			const p = hop.k / 6;
			fairyP.x = hop.fx + (hop.tx - hop.fx) * p; fairyP.y = hop.fy + (hop.ty - hop.fy) * p;
			if (hop.k >= 6) { fairyP.x = hop.tx; fairyP.y = hop.ty; hop = null;
				if (fairyP.y === 0) { flashT = 50; fish = null; if (screenNo >= 20) finishing = true; else { screenNo++; speedMul = Math.min(1.8, speedMul + .05); newFrogs(); } } }
		}
		if (flashT && --flashT === 0) { if (finishing) startEnd(); else spawnFairy(); }

		// frogs: float by, tongue out if the fairy gets close
		for (const f of frogs) {
			f.x += f.dir * f.sp; if (f.x > 176) f.x -= 192; if (f.x < -16) f.x += 192;
			const fx = f.x + 8, fy = f.y + 10, sameRow = Math.abs(fairyP.y - f.y) < 8, d = Math.abs(cx - fx);
			if (f.cd > 0) f.cd--;
			if (f.tt < 0 && !dead && !flashT && sameRow && d <= 20 && f.cd <= 0) { f.tt = 0; f.ax = cx > fx ? 1 : -1; f.ay = 0; f.len = Math.min(d + 4, 24); }
			if (f.tt >= 0) {
				f.tt++;
				const k = f.tt, L = k < 10 ? f.len * k / 10 : k < 16 ? f.len : f.len * (26 - k) / 10;
				f.cur = Math.max(0, L);
				const tx = fx + f.ax * f.cur, ty = fy + f.ay * f.cur;
				if (!dead && !flashT && f.tt < 18 && Math.hypot(cx - tx, cy - fy) < 7) kill(cx, cy);
				if (f.tt >= 26) { f.tt = -1; f.cd = 40; }
			}
		}
		// fish: a ripple, then a leap
		if (--fishT <= 0 && !fish && !flashT) {
			const near = Math.random() < .6 && fairyP.y < 14 * T;
			const col = near ? Math.max(0, Math.min(9, Math.round(fairyP.x / T) + (Math.random() * 3 | 0) - 1)) : Math.random() * 10 | 0;
			const row = near ? Math.max(1, Math.min(13, Math.round(fairyP.y / T) + (Math.random() * 3 | 0) - 1)) : 1 + (Math.random() * 13 | 0);
			fish = { x: col * T + 8, y: row * T + 8, k: 0, flip: Math.random() < .5 };
			fishT = 150 + Math.random() * 150 | 0;
		}
		if (fish) {
			fish.k++;
			if (fish.k > 50 && fish.k < 80 && !dead && !flashT) {
				// only the block where the fish jumps (marked by the ripples) is dangerous
				if (Math.floor(cx / T) === Math.floor(fish.x / T) && Math.floor(cy / T) === Math.floor(fish.y / T)) kill(cx, cy);
			}
			if (fish.k === 50 || fish.k === 80) burst(fish.x, fish.y, 6);
			if (fish.k > 84) fish = null;
		}
		// death → respawn / game over
		if (dead && ++dead > 50) { if (lives <= 0) { state = "over"; t = 0; } else spawnFairy(); }
		for (let i = sparks.length - 1; i >= 0; i--) { const s = sparks[i]; s.x += s.dx; s.y += s.dy; if (--s.l <= 0) sparks.splice(i, 1); }
	}

	// ---------- drawing ----------
	function ring(cx, cy, r, c) {
		g.fillStyle = c;
		for (let a = 0; a < 16; a++) { const an = a / 16 * Math.PI * 2; g.fillRect(Math.round(cx + Math.cos(an) * r), Math.round(cy + Math.sin(an) * r * .5), 1, 1); }
	}
	// plain rocky banks with a jagged edge, kept clear so the HUD is easy to read
	const HEART = [".##..##.", "########", "########", "########", ".######.", "..####..", "...##...", "........"];
	const ROCK = [0, 2, 1, 3, 2, 0, 3, 1, 2, 3, 0, 2, 1, 3, 1, 0, 2, 3, 1, 2, 0, 3, 2, 1, 3, 0];
	function drawBank() {
		for (let x = 0; x < W; x++) {
			const o = ROCK[Math.floor(x / 6) % ROCK.length], po = x ? ROCK[Math.floor((x - 1) / 6) % ROCK.length] : o;
			const hi = Math.max(o, po), lo = Math.min(o, po);
			R(x, 16 - hi, 1, hi - lo + 1, M); R(x, 15 - hi, 1, 1, D);     // top bank edge (blocky rock teeth)
			R(x, 224 + lo, 1, hi - lo + 1, M); R(x, 225 + hi, 1, 1, D);   // bottom bank edge
		}
	}
	function drawWater() {
		for (let r = 1; r < 14; r++) for (let k = 0; k < 2; k++) {
			const x = ((r * 37 + k * 71 + ((t >> 5) & 1) * 3) % 150), y = r * T + 5 + k * 6;
			R(x, y, 4, 1, D);
		}
	}
	function drawFairyObj() {
		if (dead || (flashT && (t >> 2 & 1))) return;
		const bob = hop ? -Math.round(Math.sin(hop.k / 6 * Math.PI) * 3) : (t >> 4 & 1);
		fairy(fairyP.x, fairyP.y + bob);
	}
	function drawPlay() {
		drawBank(); drawWater();
		if (fish && fish.k < 50) { const r = 2 + (fish.k % 25) / 3; ring(fish.x, fish.y, r, M); ring(fish.x, fish.y, Math.max(1, r - 4), D); }
		if (fish && fish.k >= 50 && fish.k < 80) drawFish(fish.x - 8, fish.y - 5 - Math.sin((fish.k - 50) / 30 * Math.PI) * 12, fish.flip);
		for (const f of frogs) drawFrog(f.x, f.y);
		for (const f of frogs) if (f.tt >= 0 && f.cur > 0) { // tongues
			const fx = f.x + 8, fy = f.y + 10;
			for (let s = 0; s <= f.cur; s++) R(fx + f.ax * s, fy + f.ay * s, 1, 1, G);
			R(fx + f.ax * f.cur - 1, fy + f.ay * f.cur - 1, 3, 3, M); R(fx + f.ax * f.cur, fy + f.ay * f.cur, 1, 1, G);
		}
		drawFairyObj();
		g.fillStyle = G; for (const s of sparks) if (s.l > 6 || s.l >> 1 & 1) g.fillRect(Math.round(s.x), Math.round(s.y), 1, 1);
		// HUD on the starting bank
		for (let i = 0; i < lives; i++) for (let j = 0; j < 8; j++) for (let k = 0; k < 8; k++) if (HEART[j][k] === "#") R(4 + i * 11 + k, 229 + j, 1, 1, G);
		txt(screenNo + "/20", 156, 230, G, "right");
		txt(String(pts).padStart(3, "0"), 80, 4, G, "center");
	}
	function draw() {
		g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
		if (state === "title") {
			fairy(72, 52 + (t >> 4 & 1));
			txt("Fairy", 80, 100, G, "center", 2);
			txt("Click to Play", 80, 132, (t >> 5 & 1) ? G : M, "center");
		} else if (state === "over") {
			drawBank(); drawWater();
			txt("Game", 80, 70, G, "center", 2); txt("Over", 80, 94, G, "center", 2);
			txt("Score: " + String(pts).padStart(3, "0"), 80, 132, M, "center");
			if (t > 60) txt("Click to Play", 80, 170, (t >> 5 & 1) ? G : M, "center");
		} else if (state === "end") drawEnd();
		else drawPlay();
		if (fade > 0) { g.fillStyle = `rgba(0,0,0,${fade})`; g.fillRect(0, 0, W, H); }
	}

	// ---------- ending: crawling onto dry ground ----------
	let seed = 7; const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
	const PLANTS = [];
	for (let n = 0; n < 400 && PLANTS.length < 46; n++) {
		const x = 6 + (rnd() * 148 | 0), y = 22 + (rnd() * 168 | 0), ty = rnd() * 3 | 0;
		if (x > 4 && x < 156 && y > 24 && y < 74 && x > 0 && y > 24 && y < 74) continue; // keep the message area clear
		if (x > 50 && x < 108 && y > 100) continue;                                       // keep the crawl path clear
		PLANTS.push({ x, y, ty });
	}
	{ // the right side mirrors the left side, and no two plants may crowd or overlap each other
		const kept = [], far = (q) => kept.every((k) => Math.hypot(k.x - q.x, k.y - q.y) >= 19);
		for (const q of PLANTS.filter((q) => q.x < 80)) if (far(q)) kept.push(q);
		for (const q of kept.slice()) { const m = { x: 154 - q.x, y: q.y, ty: (q.ty + 1) % 3 }; if (q.y <= 172 && far(m)) kept.push(m); }
		PLANTS.length = 0;
		for (const q of kept) PLANTS.push(q);
	}
	PLANTS.push({ x: 36, y: 147, ty: 1 }, { x: 140, y: 150, ty: 2 }, { x: 100, y: 150, ty: 0 }); // two fill-ins to even out the middle sides
	PLANTS.sort((a, b) => a.y - b.y);
	// plants and rocks for the final scene: your pixel drawings
	const FLOWER_A = [".#.", "#.#", "#.#", ".#.", ".#.", ".#.", "###"];
	const SPRIG = ["..#..", ".#.#.", "..#..", "..#..", ".###.", "..#..", "#.#.#", ".###."];
	const FLOWER_B = [".###.", "#...#", ".###.", "..#..", "..#..", "#.#.#", "#.#.#", ".###."];
	const GRASS_A = [".#.#.#.", "..#.#..", "#.###.#"];
	const GRASS_B = [".#.#.#.", "#.#.#.#"];
	function plant(x, y, ty, v) {
		const a = v != null ? [GRASS_A, GRASS_B, FLOWER_A, FLOWER_B, SPRIG][v] : ty === 0 ? ((x + y) & 1 ? GRASS_A : GRASS_B) : ty === 1 ? ((x >> 1) & 1 ? FLOWER_A : FLOWER_B) : SPRIG;
		const top = y + 12 - a.length;
		for (let j = 0; j < a.length; j++) for (let i = 0; i < a[j].length; i++) if (a[j][i] === "#") R(x + i, top + j, 1, 1, M);
	}
	function drawEnd() {
		for (let i = 1; i < 30; i++) R((i * 53) % 156, 20 + (i * 37) % 176, 2, 1, D); // dry ground specks
		for (const q of PLANTS) plant(q.x, q.y, q.ty, q.v);
		const p = Math.min(1, et / 230), x = 72 + (et < 230 ? (et >> 3 & 1) : 0);
		const y = 198 - 70 * (p + (p < 1 ? .035 * Math.sin(et / 4) : 0)) + (p >= 1 ? (et >> 4 & 1) : 0);
		fairy(x, y);
		for (let x = 0; x < W; x++) { // jagged rock bank edge; the water below hides the fairy at first
			const o = ROCK[Math.floor(x / 6) % ROCK.length], po = x ? ROCK[Math.floor((x - 1) / 6) % ROCK.length] : o;
			R(x, 201 + Math.min(o, po), 1, 40, "#000");
			R(x, 200 + Math.min(o, po), 1, Math.abs(o - po) + 1, M); R(x, 199 + Math.max(o, po), 1, 1, D);
		}
		for (let r = 0; r < 4; r++) for (let k = 0; k < 2; k++) R(((r * 41 + k * 77 + (et >> 5 & 1) * 3) % 150), 210 + r * 8 + k * 3, 4, 1, D);
		txt("gz.. you made it!", 80, 48, G, "center"); // always there, no delay and no fade
		if (et > 330) txt("Play Again?", 80, 222, (et >> 5 & 1) ? G : M, "center"); // on the water
	}

	// ---------- input ----------
	function press() {
		if (state === "title" || (state === "over" && t > 60) || (state === "end" && et > 330)) startGame();
	}
	wrap.addEventListener("pointerdown", (e) => {
		if (state !== "play") return press();
		const r = cv.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width, py = (e.clientY - r.top) * H / r.height;
		const dx = px - (fairyP.x + 8), dy = py - (fairyP.y + 8);
		if (Math.abs(dx) > Math.abs(dy)) tryHop(dx > 0 ? 1 : -1, 0); else tryHop(0, dy > 0 ? 1 : -1);
	});
	addEventListener("keydown", (e) => {
		const k = e.key.toLowerCase();
		const m = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] }[k];
		if (m) { e.preventDefault(); tryHop(m[0], m[1]); }
		else if (k === " " || k === "enter") press();
	});

	state = "title"; t = 0; et = 0; fade = 1; lives = 3; pts = 0; screenNo = 1; speedMul = 1; frogs = []; sparks = [];
	let last = 0, acc = 0;
	function loop(ts) {
		acc += Math.min(ts - last, 100); last = ts;
		while (acc >= 16.67) { update(); acc -= 16.67; }
		draw(); requestAnimationFrame(loop);
	}
	requestAnimationFrame(loop);
	window.__fc = { start: startGame, st: () => ({ state, lives, pts, screenNo }), win() { startGame(); screenNo = 20; finishing = true; startEnd(); }, skip(n) { for (let i = 0; i < n; i++) update(); }, hop: tryHop, fairy: () => fairyP };
})();
</script></body></html>
